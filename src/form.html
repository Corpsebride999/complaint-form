<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Complaint Form</title>
<style>
:root{--pri:#1f4e79;--pri-l:#e8eef5;--ink:#1d2430;--mut:#667085;--line:#d9dee7;--bg:#f4f6f9;--auto:#fff6d6}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 110px}
header.top{background:#fff;border-radius:14px;padding:16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-top:6px solid var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.06)}
header.top img{max-height:56px;max-width:180px;object-fit:contain}
.brand{flex:1;min-width:200px}
.brand h1{margin:0;font-size:22px;color:var(--pri)}
.brand .sub{color:var(--mut);font-size:13px}
.meta{text-align:right;font-size:13px;color:var(--mut)}
.meta b{color:var(--ink);font-size:15px}
.langs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;margin-left:3px;cursor:pointer;font-weight:600}
.langs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
section.card{background:#fff;border-radius:14px;padding:16px 18px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
section.card>h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
section.card>h2 .n{background:var(--pri);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);font-weight:600;gap:4px}
label.f.req>span::after{content:" *";color:#d92d20}
input,select,textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:disabled,select:disabled{background:#f2f4f7;color:#344054}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-l);border-color:var(--pri)}
.auto{background:var(--auto)!important}
.err{border-color:#d92d20!important;background:#fff5f5}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:12.5px;color:var(--mut);font-weight:400}
.locked{display:flex;justify-content:space-between;align-items:center;background:var(--pri-l);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px;gap:8px;flex-wrap:wrap}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.item h3{margin:0 0 10px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.ocrbox{background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px}
.ocrbox details{font-size:12px;color:var(--mut);margin-top:6px}
.ocrbox pre{white-space:pre-wrap;max-height:140px;overflow:auto;background:#fff;padding:6px;border-radius:6px}
.sugg{margin:10px 0;padding:10px;border-radius:10px;background:#f0f9ff;border:1px solid #b9e6fe;font-size:13.5px;display:none}
.chip{display:inline-block;background:#fff;border:1px solid #7cd4fd;border-radius:999px;padding:2px 9px;margin:3px 4px 0 0;font-size:12.5px}
fieldset.types{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 12px}
fieldset.types legend{font-weight:700;font-size:13.5px;color:var(--pri);padding:0 6px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 12px}
.tgrid label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:3px 4px;border-radius:6px;cursor:pointer}
.tgrid input{width:auto;margin-top:3px}
.tgrid label.isauto{background:var(--auto)}
.tag{font-size:10.5px;background:#fec84b;color:#5a3d00;border-radius:4px;padding:0 5px;margin-left:4px;font-weight:700}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px}
.checks input{width:auto}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f2f4f7;aspect-ratio:1}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer}
.ph input{position:absolute;bottom:0;left:0;right:0;border:0;border-radius:0;font-size:11.5px;padding:4px 6px;background:rgba(255,255,255,.9)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;box-shadow:0 -2px 10px rgba(0,0,0,.06);z-index:20}
.bar .row{max-width:980px;margin:0 auto;justify-content:flex-end}
.bar .status{margin-right:auto;font-size:12.5px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 10px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;display:none;z-index:60;max-width:90%}
#report{position:absolute;left:-10000px;top:0;width:794px;background:#fff}
#report.rendering{position:fixed;left:0;top:0;z-index:9998}
.pdfcover{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--pri)}
.rp{font:12px/1.4 Arial,sans-serif;color:#111;padding:6px 10px}
.rp .rh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--pri);padding-bottom:8px;margin-bottom:10px}
.rp .rh img{max-height:46px;max-width:170px}
.rp h1{font-size:19px;margin:0;color:var(--pri)}
.rp h2{font-size:13px;background:var(--pri);color:#fff;padding:4px 8px;margin:12px 0 6px;border-radius:3px}
.rp table{width:100%;border-collapse:collapse}
.rp td,.rp th{border:1px solid #cfd5df;padding:4px 6px;vertical-align:top;text-align:left}
.rp th{background:#eef2f7;width:26%;font-weight:700}
.rp .prow{display:flex;gap:8px;margin-bottom:8px}
.rp .pcell{flex:1;border:1px solid #cfd5df;padding:4px;text-align:center;font-size:10.5px}
.rp .pcell img{width:100%;max-height:280px;object-fit:contain;display:block;margin:0 auto 3px}
.rp .pg div{border:1px solid #cfd5df;padding:4px;text-align:center;font-size:10.5px}
.rp .pg img{width:100%;max-height:300px;object-fit:contain}
.avoid{page-break-inside:avoid;break-inside:avoid}
.rp .sec{padding-top:2px}
.pk{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fcfcfd}
.pkh{font-weight:700;font-size:13.5px;margin-bottom:6px}
.pkt{width:100%;border-collapse:collapse}
.pkt th{font-size:12px;color:var(--mut);text-align:left;padding:3px 4px;font-weight:600}
.pkt td{padding:3px 4px}
.pkt input{padding:6px 8px}
.pkt .del{border:0;background:none;cursor:pointer;font-size:16px;color:#b42318}
.pkf{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px}
.pkf label{display:flex;gap:6px;align-items:center}
.pkf input{width:auto}
.pktotal{margin-left:auto;font-weight:700}
.trnote{font-size:12px;color:#026aa2;margin-top:4px;min-height:0;font-weight:400}
.trnote a{color:#026aa2;text-decoration:underline;cursor:pointer;margin-left:6px}
.trnote .orig{display:block;margin-top:4px;padding:6px 8px;background:#f0f9ff;border-radius:6px;color:#344054;white-space:pre-wrap}
.trsw{display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:6px;cursor:pointer}
.trsw input{width:auto}
@media (max-width:600px){.meta{text-align:left}.brand h1{font-size:19px}.bar .status{display:none}}
</style>
</head>
<body>
<script id="cfg" type="application/json">__CONFIG__</script>
<div class="wrap">
 <header class="top">
  <img id="hLogo" alt="">
  <div class="brand"><h1 data-i="title"></h1><div class="sub" id="hSub"></div></div>
  <div class="meta">
   <div class="langs" id="langs"></div>
   <label class="trsw"><input type="checkbox" id="trOn"> 🌐 <span data-i="autoTr"></span> <span id="trStatus" class="note"></span></label>
   <div style="margin-top:6px"><span data-i="complaintNo"></span>: <b id="cNo"></b></div>
   <div><span data-i="date"></span>: <b id="cDate"></b></div>
  </div>
 </header>

 <section class="card">
  <h2><span class="n">1</span><span data-i="s1"></span></h2>
  <div class="locked" id="lockBar" style="display:none"><span data-i="companyLocked"></span><button class="btn sm" id="btnEditCo" data-i="editCompany"></button></div>
  <div class="grid">
   <label class="f req"><span data-i="company"></span><input data-co="company"></label>
   <label class="f req"><span data-i="contact"></span><input data-co="contact"></label>
   <label class="f"><span data-i="position"></span><input data-co="position"></label>
   <label class="f req"><span data-i="email"></span><input type="email" data-co="email"></label>
   <label class="f req"><span data-i="phone"></span><input type="tel" data-co="phone"></label>
   <label class="f"><span data-i="web"></span><input data-co="web" placeholder="www."></label>
   <label class="f"><span data-i="country"></span><input data-co="country"></label>
   <label class="f"><span data-i="address"></span><input data-co="address"></label>
  </div>
  <div class="row" style="margin-top:10px"><button class="btn pri sm" id="btnSaveCo" data-i="saveCompany"></button><span class="note" data-i="companyHint"></span></div>
 </section>

 <section class="card">
  <h2><span class="n">2</span><span data-i="s2"></span></h2>
  <div id="items"></div>
  <button class="btn" id="btnAddItem">＋ <span data-i="addProduct"></span></button>
 </section>

 <section class="card">
  <h2><span class="n">3</span><span data-i="s3"></span></h2>
  <label class="f req"><span data-i="describe"></span><textarea id="desc" data-i-ph="describePh"></textarea><div class="trnote" data-trn="desc"></div></label>
  <div class="sugg" id="sugg"></div>
  <div class="note" style="margin:8px 0" data-i="typesHint"></div>
  <div id="types"></div>
  <div class="grid" style="margin-top:6px">
   <label class="f"><span data-i="whenObserved"></span><select id="observed"></select></label>
   <label class="f"><span data-i="appDate"></span><input type="date" id="appDate"></label>
   <label class="f"><span data-i="substrate"></span><input id="substrate"><div class="trnote" data-trn="substrate"></div></label>
   <label class="f"><span data-i="conditions"></span><input id="conditions" data-i-ph="conditionsPh"><div class="trnote" data-trn="conditions"></div></label>
   <label class="f"><span data-i="area"></span><input id="area"></label>
   <label class="f"><span data-i="applicator"></span><input id="applicator"></label>
  </div>
 </section>

 <section class="card">
  <h2><span class="n">4</span><span data-i="s4"></span> <span class="note" id="phCount"></span></h2>
  <div class="row"><label class="btn">📷 <span data-i="addPhotos"></span><input type="file" id="phIn" accept="image/*" multiple hidden></label><span class="note" data-i="photosHint"></span></div>
  <div class="photos" id="photos"></div>
 </section>

 <section class="card">
  <h2><span class="n">5</span><span data-i="s5"></span></h2>
  <div class="checks" id="requests"></div>
  <div class="grid" style="margin-top:10px">
   <label class="f"><span data-i="urgency"></span><select id="urgency"></select></label>
   <label class="f"><span data-i="claimValue"></span><input id="claimValue" data-i-ph="claimValuePh"></label>
  </div>
  <label class="f" style="margin-top:10px"><span data-i="notes"></span><textarea id="notes" style="min-height:70px"></textarea><div class="trnote" data-trn="notes"></div></label>
 </section>

 <section class="card">
  <h2><span class="n">6</span><span data-i="s6"></span></h2>
  <p class="note" data-i="declText"></p>
  <div class="grid">
   <label class="f req"><span data-i="signer"></span><input id="signer"></label>
   <label class="f"><span data-i="signerPos"></span><input id="signerPos"></label>
  </div>
 </section>
 <p class="note" style="text-align:center;margin-top:18px" id="foot"></p>
</div>

<div class="bar"><div class="row">
 <span class="status" id="status"></span>
 <button class="btn sm" id="btnSettings" style="display:none">⚙️ <span data-i="settings"></span></button>
 <button class="btn sm" id="btnNew">🆕 <span data-i="newC"></span></button>
 <button class="btn sm" id="btnHtml">💾 <span data-i="saveHtml"></span></button>
 <button class="btn sm" id="btnPdf">📄 <span data-i="pdf"></span></button>
 <button class="btn pri sm" id="btnMail">✉️ <span data-i="email2"></span></button>
</div></div>

<div class="modal" id="mMail"><div class="box">
 <h3 data-i="sendTitle"></h3>
 <label class="f"><span data-i="toEmail"></span><select id="mailTo"></select></label>
 <label class="f" id="mailOtherWrap" style="margin-top:8px;display:none"><span data-i="otherEmail"></span><input type="email" id="mailOther"></label>
 <p class="note" data-i="sendHint"></p>
 <div class="row" style="justify-content:flex-end"><button class="btn" data-close data-i="cancel"></button><button class="btn pri" id="mailGo" data-i="send"></button></div>
</div></div>

<div class="modal" id="mSet"><div class="box">
 <h3>⚙️ <span data-i="settings"></span></h3>
 <p class="note" data-i="setIntro"></p>
 <div class="grid">
  <label class="f"><span data-i="setName"></span><input id="sName"></label>
  <label class="f"><span data-i="web"></span><input id="sWeb"></label>
  <label class="f"><span data-i="email"></span><input id="sEmail"></label>
  <label class="f"><span data-i="phone"></span><input id="sPhone"></label>
  <label class="f"><span data-i="setColor"></span><input type="color" id="sColor" style="height:40px;padding:3px"></label>
  <label class="f"><span data-i="setPrefix"></span><input id="sPrefix"></label>
 </div>
 <label class="f" style="margin-top:10px"><span data-i="setLogo"></span><input type="file" id="sLogo" accept="image/*"></label>
 <label class="f" style="margin-top:10px"><span data-i="setRecip"></span><textarea id="sRecip" style="min-height:70px" placeholder="Quality Dept | quality@yourcompany.com"></textarea></label>
 <h4 style="margin:16px 0 6px" data-i="setTax"></h4>
 <p class="note" data-i="setTaxHint"></p>
 <div class="row"><button class="btn sm" id="sTpl">⬇️ <span data-i="setTpl"></span></button><label class="btn sm">⬆️ <span data-i="setImport"></span><input type="file" id="sImp" accept=".xlsx,.xls,.csv" hidden></label><button class="btn sm" id="sTaxReset" data-i="setTaxReset"></button></div>
 <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn sm" id="sReset" data-i="setReset"></button><button class="btn" data-close data-i="cancel"></button><button class="btn pri" id="sSave" data-i="save"></button></div>
</div></div>

<div class="modal" id="mGroup"><div class="box" style="max-width:460px">
 <h3>📦 <span data-i="gqTitle"></span></h3>
 <p class="note" data-i="gqHint"></p>
 <p class="note" id="gqText" style="font-style:italic"></p>
 <div id="gqBtns"></div>
 <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn sm" id="gqSkip" data-i="gqSkip"></button></div>
</div></div>

<div class="toast" id="toast"></div>
<div id="report"></div>

<script>
"use strict";
// pristine copy of this page (taken before anything is filled in) — used by "Save HTML"
const SRC_HTML = (()=>{ const h='<!DOCTYPE html>\n'+document.documentElement.outerHTML, cut=h.indexOf('<script id="cfg"');
  return h.slice(0,cut).replace(/<script id="preload"[\s\S]*?<\/script>\s*/,'') + h.slice(cut); })();
const CFG0 = JSON.parse(document.getElementById('cfg').textContent);
// a saved HTML copy carries its complaint inside; it is kept separate from this browser's own draft
const PRE = (()=>{try{const e=document.getElementById('preload');return e?JSON.parse(e.textContent):null}catch(e){return null}})();
const KEY = (CFG0.key || 'pcf') + (PRE ? '_copy_'+PRE.id : '');
const LS = {
  get(k,d){try{const v=localStorage.getItem(KEY+'_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(KEY+'_'+k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(KEY+'_'+k)}catch(e){}}
};
let CFG = JSON.parse(JSON.stringify(CFG0));
if (PRE){ if(PRE.brand) CFG.brand=PRE.brand; if(PRE.recipients) CFG.recipients=PRE.recipients; if(PRE.prefix) CFG.prefix=PRE.prefix; if(PRE.taxonomy) CFG.taxonomy=PRE.taxonomy; }
if (CFG.allowCustomize && !PRE){
  const b = LS.get('brand',null);
  if (b){ Object.assign(CFG.brand, b.brand||{}); if(b.recipients) CFG.recipients=b.recipients; if(b.prefix) CFG.prefix=b.prefix; }
  const tx = LS.get('taxonomy',null); if (tx) CFG.taxonomy = tx;
}

let L = LS.get('lang', (PRE&&PRE.lang) || CFG.defaultLang || (CFG.languages||['en'])[0]);
if (!T[L]) L='en';
const t = k => (T[L][k] ?? T.en[k] ?? k);
const lbl = o => (o && (o[L] || o.en)) || '';

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s){return String(s||'').replace(/İ/g,'i').replace(/I/g,'i').toLowerCase().replace(/ı/g,'i').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ')}
function toast(m,ms=2600){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)) return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const kwRe = {};
function hasKw(n, kw){const k=norm(kw).trim(); if(!k) return false; const r = kwRe[k] || (kwRe[k]=new RegExp('(^|[^\\p{L}\\p{N}])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'u')); return r.test(n)}

/* ---------------- state ---------------- */
const rid = () => Math.random().toString(36).slice(2,9);
const blankRow = () => ({size:'',units:'',base:''});
const blankItem = () => ({id:rid(),group:'',product:'',code:'',batch:'',prod:'',exp:'',invoice:'',delivery:'',rows:[blankRow()],whole:false,auto:{},ocrText:''});
const blank = () => ({no:'',date:new Date().toISOString().slice(0,10),items:[blankItem()],desc:'',types:{},autoTypes:{},observed:0,appDate:'',substrate:'',conditions:'',area:'',applicator:'',photos:[],requests:[],urgency:0,claimValue:'',notes:'',signer:'',signerPos:'',tx:{}});
let S = Object.assign(blank(), LS.get('draft', PRE ? PRE.S : {}));
if(!S.tx) S.tx={};
S.items.forEach(i=>{ if(!i.id) i.id=rid(); if(!i.rows) i.rows=[{size:i.pack||'',units:i.qty||'',base:''}]; if(!i.auto) i.auto={}; });
['desc','substrate','conditions','notes'].forEach(f=>{ if(S[f] && !S.tx[f]){ const s=/[а-яё]/i.test(S[f])?'ru':(/[çğışöüİ]/i.test(S[f])?'tr':'en'); S.tx[f]={src:s,[s]:S[f]} } });
let CO = LS.get('company', PRE ? PRE.company : null);
let coEditing = !CO;
let company = Object.assign({company:'',contact:'',position:'',email:'',phone:'',web:'',country:'',address:''}, CO||{}, S.companyDraft||{});
if (S.companyDraft && CO) coEditing = true;

function complaintNo(){
  if (!S.no){ const n=(LS.get('counter',0)||0)+1; LS.set('counter',n); S.no=String(n).padStart(4,'0'); }
  const ini = norm(company.company).replace(/[^a-z0-9]/g,'').slice(0,3).toUpperCase();
  return [(CFG.prefix||'PCF'), S.date.slice(0,4), ini, S.no].filter(Boolean).join('-');
}
let saveT;
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{
  S.companyDraft = coEditing ? company : null;
  let ok = LS.set('draft', S);
  if(!ok) LS.set('draft', Object.assign({}, S, {photos:[]}));
  $('#status').textContent = '✓ '+t('saved')+' · '+new Date().toTimeString().slice(0,5);
},400)}

/* ---------------- taxonomy ---------------- */
const TAX = () => CFG.taxonomy;
const groupById = id => TAX().groups.find(g=>g.id===id);
function allProducts(){const a=[];TAX().groups.forEach(g=>(g.products||[]).forEach(p=>a.push({g:g.id,code:p.code,name:p.name,n:norm(p.name)})));return a}

function manualGroups(){ return S.items.filter(i=>i.group && !i.auto.group).map(i=>i.group) }
function classify(text){
  const n = ' '+norm(text)+' ';
  const res = {groups:[], types:[], tied:[], clear:false};
  if (n.trim().length < 4) return res;
  const kwScore=(list)=>{let s=0;(list||[]).forEach(ty=>(ty.kw||[]).forEach(k=>{if(hasKw(n,k)) s+=(norm(k).length>5?2:1)}));return s};
  // group score = product / group words (strong) + matching complaint-type words
  TAX().groups.forEach(g=>{
    let s=0; (g.kw||[]).forEach(k=>{if(hasKw(n,k)) s+=4});
    (g.products||[]).forEach(p=>{if(p.name && norm(p.name).length>3 && hasKw(n,p.name)) s+=10});
    s += kwScore(g.types);
    if (s) res.groups.push({id:g.id,score:s});
  });
  res.groups.sort((a,b)=>b.score-a.score);
  if (res.groups.length){ const top=res.groups[0].score; res.tied=res.groups.filter(g=>g.score===top).map(g=>g.id); res.clear=res.tied.length===1; }
  const man = manualGroups();
  const cand = man.length ? man : (res.clear ? [res.tied[0]] : []);
  const scoreTypes=(list,gid)=>list.forEach(ty=>{let s=0;(ty.kw||[]).forEach(k=>{if(hasKw(n,k)) s+=(norm(k).length>5?2:1)}); if(s) res.types.push({key:gid+':'+ty.id,score:s})});
  [...new Set(cand)].forEach(gid=>{const g=groupById(gid); if(g) scoreTypes(g.types||[], gid)});
  scoreTypes(TAX().common||[], 'common');
  res.types.sort((a,b)=>b.score-a.score);
  return res;
}
let clsT, askT;
function clearAutoTypes(){ Object.keys(S.autoTypes).forEach(k=>{ if(S.autoTypes[k]){ delete S.types[k]; delete S.autoTypes[k]; } }) }
function runClassify(){
  const DESC = allLangText('desc').trim();
  const sg=$('#sugg');
  clearTimeout(askT);
  if (!DESC){
    // description deleted -> remove everything that was chosen automatically
    // reset product groups to "select" (keep it only where a product name is entered: the group belongs to that product)
    S.items.forEach(i=>{ if(!String(i.product||'').trim()){ i.group=''; delete i.auto.group; if(i.auto.code){ i.code=''; delete i.auto.code; } } });
    S.types={}; S.autoTypes={};
    clearAutoTypes(); S.asked=''; sg.style.display='none';
    renderItems(); renderTypes(); persist(); return;
  }
  const r = classify(DESC);
  const man = manualGroups();
  if (!man.length){
    const autoIt = S.items.find(i=>i.auto.group);
    const want = r.clear ? r.tied[0] : '';
    if (autoIt && autoIt.group!==want){ autoIt.group=''; delete autoIt.auto.group; }
    if (want && !S.items.some(i=>i.group)){ S.items[0].group=want; S.items[0].auto.group=1; }
    renderItems();
    if (r.tied.length>1){ const key=r.tied.slice().sort().join(','); if (S.asked!==key) askT=setTimeout(()=>askGroup(r.tied,key),1500); }
  }
  const top = r.types.filter(x=>!x.key.endsWith('cm_other')).slice(0,4).map(x=>x.key);
  Object.keys(S.autoTypes).forEach(k=>{ if(S.autoTypes[k] && !top.includes(k)){ delete S.types[k]; delete S.autoTypes[k]; } });
  top.forEach(k=>{ if(S.types[k]===undefined || S.autoTypes[k]){ S.types[k]=true; S.autoTypes[k]=true; } });
  const hasGroup = S.items.some(i=>i.group);
  if (r.groups.length || top.length){
    sg.style.display='block';
    sg.innerHTML = '🔎 <b>'+esc(t('suggested'))+'</b><br>' +
      (hasGroup
        ? S.items.filter(i=>i.group).slice(0,1).map(i=>'<span class="chip">📦 '+esc(lbl(groupById(i.group).label))+'</span>').join('')
        : r.tied.length ? '<span class="note">'+esc(t('pickGroup'))+'</span><br>'+r.tied.slice(0,8).map(id=>'<button class="chip" style="cursor:pointer" data-pg="'+id+'">📦 '+esc(lbl(groupById(id).label))+'</button>').join('')+'<br>' : '') +
      top.map(k=>'<span class="chip">⚠️ '+esc(typeLabel(k))+'</span>').join('');
  } else sg.style.display='none';
  renderTypes(); persist();
}
function askGroup(ids,key){
  if (manualGroups().length || S.items.some(i=>i.group)) return;

/* ---------------- auto-translation of free text ---------------- */
const TR_FIELDS=['desc','substrate','conditions','notes'];
const LANG_NAME={en:'English',tr:'Türkçe',ru:'Русский'};
let trOn = LS.get('autoTr', true);
const trInst={}; let trBusy=0, trStT;
function trStatus(k){const el=$('#trStatus');clearTimeout(trStT);el.textContent=k?t(k):'';if(k==='trDone')trStT=setTimeout(()=>el.textContent='',2500)}
function detectLang(s){
  if(/[а-яёіїєґ]/i.test(s)) return 'ru';
  if(/[çğışöüİ]/i.test(s) || /\b(ve|bir|ile|ama|çok|cok|var|yok|degil|değil|urun|ürün)\b/i.test(s)) return 'tr';
  if(/\b(the|and|is|are|with|not|have|has|was)\b/i.test(s)) return 'en';
  return L==='ru' ? 'en' : L;
}
async function viaChrome(text,from,to){ if(!('Translator' in self))throw 0; const k=from+'>'+to;
  if(!trInst[k]){const av=await Translator.availability({sourceLanguage:from,targetLanguage:to}); if(av!=='available')throw 0; trInst[k]=await Translator.create({sourceLanguage:from,targetLanguage:to})}
  return await trInst[k].translate(text) }
async function viaGoogle(text,from,to){ const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+from+'&tl='+to+'&q='+encodeURIComponent(text)); if(!r.ok)throw 0; const j=await r.json(); return j[0].map(x=>x[0]).join('') }
async function viaMyMemory(text,from,to){ const parts=text.match(/[\s\S]{1,480}(?=\s|$)|[\s\S]{1,480}/g)||[text]; const out=[];
  for(const p of parts){const r=await fetch('https://api.mymemory.translated.net/get?langpair='+from+'|'+to+'&q='+encodeURIComponent(p)); const j=await r.json(); if(!j.responseData)throw 0; out.push(j.responseData.translatedText)}
  return out.join(' ') }
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(0),ms))]);
async function txText(text,from,to){ for(const fn of [viaChrome,viaGoogle,viaMyMemory]){ try{const r=await withTimeout(fn(text,from,to),fn===viaChrome?4000:9000); if(r&&r.trim()) return r}catch(e){} } throw 0 }
function trShown(f){ const x=S.tx[f]; if(!x||!x.src) return S[f]||''; return (L===x.src)? x[x.src] : (x[L] ?? x[x.src]) }
async function translateField(f){
  const x=S.tx[f]; if(!trOn||!x||!x.src) return; const src=x.src, text=x[src]; if(!text||!text.trim()) return;
  const targets=(CFG.languages||['en','tr','ru']).filter(l=>l!==src && x[l]===undefined);
  if(!targets.length) return;
  trBusy++; trStatus('translating'); let fail=false;
  for(const to of targets){ try{ const r=await txText(text,src,to); if(S.tx[f]===x && x[src]===text){ x[to]=r; if(to===L) refreshField(f) } }catch(e){ fail=true } }
  trBusy--; if(!trBusy) trStatus(fail?'trFail':'trDone');
  persist(); if(f==='desc') runClassify();
}
function refreshField(f){ const el=$('#'+f); if(document.activeElement!==el) el.value=trShown(f); trNote(f) }
function trNote(f){
  const box=$(`[data-trn="${f}"]`); if(!box) return; const x=S.tx[f];
  if(!x||!x.src||x.src===L||!x[x.src]){box.innerHTML='';return}
  if(x[L]===undefined){box.innerHTML=trOn?'🌐 '+esc(t('translating')):'';return}
  const open=box.dataset.open==='1';
  box.innerHTML=`🌐 ${esc(t('trFrom'))} ${esc(LANG_NAME[x.src]||x.src)}<a data-tog="${f}">${esc(t(open?'hideOrig':'showOrig'))}</a>${open?`<span class="orig">${esc(x[x.src])}</span>`:''}`;
}
let trT={};
function onFreeText(f,val){
  S[f]=val;
  if(!val.trim()){ delete S.tx[f]; trNote(f); return }
  const x=S.tx[f];
  // keep the same source language if the user keeps editing in that language
  const src = (x && x.src===L) ? L : detectLang(val);
  S.tx[f]={src,[src]:val}; trNote(f);
  clearTimeout(trT[f]); trT[f]=setTimeout(()=>translateField(f),1200);
}
function allLangText(f){ const x=S.tx[f]; return x? Object.entries(x).filter(([k])=>k!=='src').map(([,v])=>v).join(' \n ') : (S[f]||'') }

function compress(file,max=1400,q=.8){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res({src:c.toDataURL('image/jpeg',q),canvas:c})};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------------- label OCR ---------------- */
const OCR_DEF = {
  batch:['(?:lot|batch|parti|seri|charge|ch\\.?\\s*-?b|партия|серия)\\s*(?:no|n°|nr|№|#)?\\s*[:.\\-]?\\s*([A-Z0-9][A-Z0-9\\-\\/\\.]{3,})'],
  code:['(?<![\\p{L}])(?:kodu|kod|code|артикул|код)(?![\\p{L}])[\\s.:#\\-]*(?:no|n°|№)?[\\s.:#\\-]*((?=[A-Z0-9\\-]*\\d)[A-Z0-9][A-Z0-9\\-]{2,})'],
  prodLbl:'(prod|pro\\.?\\s?date|mfg|manuf|uret|urt|imal|p\\.?\\s?d\\b|изг|произв)',
  expLbl:'(exp|skt|son kul|best before|use by|bbe|годен|срок)'
};
function toISO(d,m,y){y=+y;if(y<100)y+=2000;d=+d;m=+m;if(m>12&&d<=12)[d,m]=[m,d];if(m<1||m>12||d<1||d>31||y<2000||y>2100)return '';return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function parseLabel(raw){
  const out={}; const txt=raw.replace(/[|]/g,'I'); const n=norm(txt); const O=Object.assign({},OCR_DEF,CFG.ocr||{});
  for(const p of O.batch){const m=txt.match(new RegExp(p,'iu')); if(m){out.batch=m[1].replace(/[.\-\/]+$/,'');break}}
  const dates=[]; const re=/(\d{1,2})\s?[.\/\-]\s?(\d{1,2})\s?[.\/\-]\s?(\d{2,4})|(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})/g; let m;
  while((m=re.exec(n))){const iso=m[1]?toISO(m[1],m[2],m[3]):toISO(m[6],m[5],m[4]); if(iso) dates.push({iso,ctx:n.slice(Math.max(0,m.index-28),m.index)})}
  const pr=new RegExp(O.prodLbl,'i'), er=new RegExp(O.expLbl,'i');
  dates.forEach(d=>{ if(er.test(d.ctx)&&!out.exp) out.exp=d.iso; else if(pr.test(d.ctx)&&!out.prod) out.prod=d.iso; });
  const rest=dates.map(d=>d.iso).filter(x=>x!==out.prod&&x!==out.exp).sort();
  if(!out.prod&&rest.length) out.prod=rest.shift();
  if(!out.exp&&rest.length) out.exp=rest.pop();
  if(out.prod&&out.exp&&out.prod>out.exp)[out.prod,out.exp]=[out.exp,out.prod];
  const prods=allProducts().filter(p=>p.n.length>=4).sort((a,b)=>b.n.length-a.n.length);
  // 1) product code printed next to "Kodu / Code" (most reliable)
  for(const p of (O.code||[])){const m=txt.match(new RegExp(p,'iu')); if(m){out.code=m[1].replace(/[.\-]+$/,'');break}}
  if(out.code){ const byCode=allProducts().filter(p=>p.code && (out.code===p.code || out.code.startsWith(p.code))).sort((a,b)=>b.code.length-a.code.length)[0];
    if(byCode){out.product=byCode.name;out.group=byCode.g} }
  // 2) product name on the label
  if(!out.product){ const nj=n.replace(/[^a-z0-9а-я]/g,''); const hit=prods.find(p=>hasKw(' '+n,p.n)) || prods.filter(p=>p.n.replace(/[^a-z0-9а-я]/g,'').length>=8).find(p=>nj.includes(p.n.replace(/[^a-z0-9а-я]/g,''))); if(hit){out.product=hit.name;out.group=hit.g;if(hit.code&&!out.code)out.code=hit.code} }
  if(!out.code){const codes=new Set(prods.filter(p=>p.code).map(p=>p.code)); const c=(n.match(/\b\d{4}\b/g)||[]).find(x=>codes.has(x)); if(c){out.code=c;const p=prods.find(x=>x.code===c);if(p&&!out.product){out.product=p.name;out.group=p.g}}}
  const pk=txt.match(/(\d+(?:[.,]\d+)?)\s?(kg|lt|l|ml|gr|g)\b/i); if(pk) out.pack=pk[1]+' '+(/^l/i.test(pk[2])?'L':pk[2].toLowerCase());
  return out;
}
// prepare the photo for reading: grayscale only (strong contrast cuts thin digits) and enlarged,
// because label text is usually small in a phone photo
function ocrCanvas(img, targetW){
  const s=Math.min(3, targetW/img.width); const c=document.createElement('canvas');
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.filter='grayscale(1)'; x.drawImage(img,0,0,c.width,c.height); return c;
}
function loadImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
// pick the best value from several reading passes: a pure number (for codes / order numbers) and the longest one wins
function bestOf(vals){ vals=vals.filter(Boolean); if(!vals.length) return ''; const num=vals.filter(v=>/^\d+$/.test(v)); const pool=num.length?num:vals; return pool.sort((a,b)=>b.length-a.length)[0]; }
async function readLabel(ix,file){
  const msg=()=>$(`[data-ocrmsg="${ix}"]`);
  const itemId=S.items[ix].id;
  S.photos=S.photos.filter(p=>!(p.label&&p.itemId===itemId)); // one label photo per product
  if(S.photos.length<10){S.photos.push({src:(await compress(file)).src,cap:'Label — '+t('item')+' '+(ix+1),label:true,itemId});renderPhotos();persist()}
  try{
    msg().textContent=t('reading');
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    const img=await loadImg(file);
    const passes=[2400,3200]; let pass=0; const results=[]; const raws=[];
    const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'&&msg())msg().textContent=t('reading')+Math.round(((pass+m.progress)/passes.length)*100)+'%'}});
    for(const w of passes){
      const r=await worker.recognize(ocrCanvas(img,w)); raws.push(r.data.text||''); results.push(parseLabel(r.data.text||''));
      const p=results[results.length-1]; if(p.batch&&p.code&&/^\d+$/.test(p.batch)&&p.prod) break;   // good enough, skip second pass
      pass++;
    }
    await worker.terminate();
    const p={}; for(const f of ['code','batch']) p[f]=bestOf(results.map(r=>r[f]));
    for(const f of ['group','product','prod','exp','pack']) p[f]=(results.find(r=>r[f])||{})[f]||'';
    if(p.code){ const byCode=allProducts().filter(x=>x.code&&(p.code===x.code||p.code.startsWith(x.code))).sort((a,b)=>b.code.length-a.code.length)[0]; if(byCode){p.product=byCode.name;p.group=byCode.g} }
    const it=S.items.find(x=>x.id===itemId); if(!it) return; it.ocrText=raws[0].trim();
    let k=0; for(const f of ['group','product','code','batch','prod','exp']){ if(p[f] && !it[f]){it[f]=p[f];it.auto[f]=1;k++} }
    if(p.pack && !it.rows[0].size){it.rows[0].size=p.pack;it.auto.size=1;k++}
    renderItems(); renderTypes(); persist(); if(S.desc) runClassify();
    msg().textContent = k? t('ocrDone') : t('ocrNone');
  }catch(err){ console.warn(err); if(msg()) msg().textContent=t('ocrFail'); }
}

/* ---------------- validation ---------------- */
function markCo(){const bad=[];['company','contact','email','phone'].forEach(k=>{const el=$(`[data-co="${k}"]`); if(!String(company[k]||'').trim()){el.classList.add('err');bad.push(el)}});return bad}
function markReq(){
  const bad=markCo();
  S.items.forEach((it,i)=>['group','product','batch'].forEach(k=>{if(!it[k]){const el=$(`.item[data-ix="${i}"] [data-k="${k}"]`);el.classList.add('err');bad.push(el)}}));
  if(!S.desc.trim()){$('#desc').classList.add('err');bad.push($('#desc'))}
  if(!S.signer.trim()){$('#signer').classList.add('err');bad.push($('#signer'))}
  if(bad.length){bad[0].scrollIntoView({behavior:'smooth',block:'center'});toast(t('required'))}
  return !bad.length;
}

/* ---------------- report / PDF ---------------- */
function pkRows(it){
  const rows=it.rows.filter(r=>r.size||r.units||r.base); if(!rows.length&&!it.whole) return '';
  const base=showBase(it);
  return `<tr><th>${esc(t('pkTitle'))}</th><td>${rows.length?`<table style="width:100%"><tr><th style="width:auto">${esc(t('pkSize'))}</th>${base?`<th style="width:auto">${esc(t('pkBase'))}</th>`:''}<th style="width:auto">${esc(t('pkUnits'))}</th></tr>${rows.map(r=>`<tr><td>${esc(r.size)}</td>${base?`<td>${esc(r.base)}</td>`:''}<td>${esc(r.units)}</td></tr>`).join('')}<tr><td colspan="${base?2:1}"><b>${esc(t('pkTotal'))}</b></td><td><b>${unitsTotal(it)}</b></td></tr></table>`:''}${it.whole?`<div style="margin-top:4px">☑ ${esc(t('pkWhole'))}</div>`:''}</td></tr>`;
}
function buildReport(){
  const b=CFG.brand||{}; const row=(k,v)=>v?`<tr><th>${esc(t(k))}</th><td>${esc(v)}</td></tr>`:'';
  const fmt=d=>d?d.split('-').reverse().join('.'):'';
  const typesSel=Object.keys(S.types).filter(k=>S.types[k]).map(typeLabel);
  const orig=f=>{const x=S.tx[f]; return (x&&x.src&&x.src!==L&&x[L]!==undefined)?`<div style="margin-top:5px;padding-top:4px;border-top:1px dashed #cfd5df;color:#555;font-size:11px"><b>${esc(t('original'))} (${esc(LANG_NAME[x.src]||x.src)}):</b> ${esc(x[x.src])}</div>`:''};
  const trow=(k,f)=>trShown(f)?`<tr><th>${esc(t(k))}</th><td style="white-space:pre-wrap">${esc(trShown(f))}${orig(f)}</td></tr>`:'';
  return `<div class="rp">
  <div class="rh"><div>${b.logo?`<img src="${b.logo}">`:''}<div style="font-size:10.5px;color:#555;margin-top:3px">${esc([b.name,b.web,b.email,b.phone].filter(Boolean).join(' · '))}</div></div>
  <div style="text-align:right"><h1>${esc(t('title'))}</h1><div>${esc(t('complaintNo'))}: <b>${esc(complaintNo())}</b></div><div>${esc(t('date'))}: <b>${fmt(S.date)}</b></div></div></div>
  <div class="sec avoid"><h2>1. ${esc(t('s1'))}</h2><table>${row('company',company.company)}${row('contact',company.contact)}${row('position',company.position)}${row('email',company.email)}${row('phone',company.phone)}${row('web',company.web)}${row('country',company.country)}${row('address',company.address)}</table></div>
  ${S.items.map((it,i)=>`${i===0?`<div class="sec avoid"><h2>2. ${esc(t('s2'))}</h2>`:''}<table class="${i?'avoid':''}" style="margin-bottom:6px"><tr><th colspan="2" style="background:#dde5ef">${esc(t('item'))} ${i+1}</th></tr>${row('group',lbl((groupById(it.group)||{}).label))}${row('product',it.product)}${row('code',it.code)}${row('batch',it.batch)}${row('prodDate',fmt(it.prod))}${row('expDate',fmt(it.exp))}${pkRows(it)}${row('invoice',it.invoice)}${row('delivery',fmt(it.delivery))}</table>${i===0?'</div>':''}`).join('')}
  <div class="sec avoid"><h2>3. ${esc(t('s3'))}</h2><table>${trow('describe','desc')}${typesSel.length?`<tr><th>${esc(t('types3'))}</th><td>${typesSel.map(x=>'• '+esc(x)).join('<br>')}</td></tr>`:''}${S.observed?row('whenObserved',t('obs')[S.observed]):''}${row('appDate',fmt(S.appDate))}${trow('substrate','substrate')}${trow('conditions','conditions')}${row('area',S.area)}${row('applicator',S.applicator)}</table></div>
  <div class="sec avoid"><h2>4. ${esc(t('s5'))}</h2><table>${S.requests.length?`<tr><th>${esc(t('s5'))}</th><td>${S.requests.map(i=>'☑ '+esc(t('req')[i])).join('<br>')}</td></tr>`:''}${row('urgency',t('urg')[S.urgency])}${row('claimValue',S.claimValue)}${trow('notes','notes')}</table></div>
  <div class="sec avoid"><h2>5. ${esc(t('s6'))}</h2><table><tr><td colspan="2">${esc(t('declText'))}</td></tr>${row('signer',S.signer)}${row('signerPos',S.signerPos)}</table></div>
  ${S.photos.length?`${S.photos.reduce((rows,p,i)=>{if(i%2===0)rows.push([]);rows[rows.length-1].push([p,i]);return rows},[]).map((r,ri)=>`${ri===0?`<div class="avoid"><h2>6. ${esc(t('s4'))} (${S.photos.length})</h2>`:''}<div class="prow ${ri?'avoid':''}">${r.map(([p,i])=>`<div class="pcell"><img src="${p.src}"><div>${i+1}. ${esc(p.cap||'')}</div></div>`).join('')}${r.length<2?'<div class="pcell" style="border:0"></div>':''}</div>${ri===0?'</div>':''}`).join('')}`:''}
  </div>`;
}
const fileName=()=>`${complaintNo()}_${norm(company.company).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'complaint'}.pdf`;
async function makePdf(){
  await loadScript('https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js');
  // html2canvas only "sees" content that is on screen and not scrolled away, so the report is placed
  // at the top-left of the window for the moment of capture, hidden behind a "Creating PDF…" cover.
  const cover=document.createElement('div'); cover.className='pdfcover'; cover.textContent='📄 '+t('pdfMaking'); document.body.appendChild(cover);
  const el=$('#report'); el.innerHTML=buildReport(); el.classList.add('rendering');
  const sx=window.scrollX, sy=window.scrollY; window.scrollTo(0,0);
  await new Promise(r=>setTimeout(r,60));
  await Promise.all([...el.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  try{
    return await html2pdf().set({margin:[8,8,10,8],image:{type:'jpeg',quality:.92},
      html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0,backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:'.avoid'}}).from(el.firstElementChild).outputPdf('blob');
  } finally { el.classList.remove('rendering'); el.innerHTML=''; cover.remove(); window.scrollTo(sx,sy); }
}
function saveHtml(){
  const data={id:complaintNo(),S,company:Object.assign({},company),lang:L};
  if(CFG.allowCustomize){ data.brand=CFG.brand; data.recipients=CFG.recipients; data.prefix=CFG.prefix; data.taxonomy=CFG.taxonomy; }
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  const html=SRC_HTML.replace('<script id="cfg"','<script id="preload" type="application/json">'+json+'</scr'+'ipt>\n<script id="cfg"');
  download(new Blob([html],{type:'text/html'}), fileName().replace(/\.pdf$/,'.html'));
  toast(t('htmlOk'),4500);
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
$('#btnHtml').onclick=()=>saveHtml();
$('#btnPdf').onclick=async()=>{ if(!markReq())return; try{download(await makePdf(),fileName());toast(t('pdfOk'))}catch(e){console.warn(e);toast(t('pdfFail'),5000)} };
$('#btnMail').onclick=()=>{ if(!markReq())return;
  const r=CFG.recipients||[]; $('#mailTo').innerHTML=r.map(x=>`<option value="${esc(x.email)}">${esc(x.label?x.label+' — '+x.email:x.email)}</option>`).join('')+`<option value="__other">${esc(t('other'))}</option>`;
  $('#mailOtherWrap').style.display=r.length?'none':''; if(!r.length) $('#mailTo').value='__other';

$('#mailGo').onclick=async()=>{
  let to=$('#mailTo').value; if(to==='__other') to=$('#mailOther').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){$('#mailOther').classList.add('err');$('#mailOtherWrap').style.display='';return}
  $('#mMail').classList.remove('on');
  let blob; try{blob=await makePdf()}catch(e){toast(t('pdfFail'),5000);return}
  const name=fileName(), subj=`${t('title')} ${complaintNo()} — ${company.company}`;
  const typesSel=Object.keys(S.types).filter(k=>S.types[k]).map(typeLabel);
  const body=[`${t('complaintNo')}: ${complaintNo()}`,`${t('company')}: ${company.company}`,`${t('contact')}: ${company.contact} (${company.phone}, ${company.email})`,'',
    ...S.items.map((it,i)=>`${t('item')} ${i+1}: ${it.product}${it.code?' ['+it.code+']':''} · ${t('batch')}: ${it.batch}${it.prod?' · '+t('prodDate')+': '+it.prod:''}`+(it.rows.some(r=>r.size||r.units)?'\n   '+it.rows.filter(r=>r.size||r.units).map(r=>`${r.units||'?'} × ${r.size}${r.base?' ('+r.base+')':''}`).join(', ')+` = ${unitsTotal(it)}`:'')+(it.whole?' · '+t('pkWhole'):'')),'',
    typesSel.map(x=>'• '+x).join('\n'),'',trShown('desc').slice(0,900),
    (S.tx.desc&&S.tx.desc.src&&S.tx.desc.src!==L)?`\n${t('original')} (${LANG_NAME[S.tx.desc.src]}): ${S.tx.desc[S.tx.desc.src].slice(0,600)}`:'','',`📎 ${name}`].join('\n');
  const file=new File([blob],name,{type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)){
    try{await navigator.share({files:[file],title:subj,text:`To: ${to}\n\n`+body});return}catch(e){}
  }
  download(blob,name);
  setTimeout(()=>{location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body+'\n\n('+t('attachNote')+')')}`},700);
  toast('📎 '+t('attachNote')+': '+name,7000);
};

$('#sImp').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;

    await loadScript(XLSX_SRC); const wb=XLSX.read(await f.arrayBuffer());
    const sh=wb.Sheets['ComplaintTypes']||wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:''}).slice(1).filter(r=>String(r[0]).trim()&&String(r[4]).trim());
    const split=s=>String(s||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
    const tax={common:[],groups:[]}; const gmap={};
    rows.forEach((r,i)=>{const ty={id:'t'+i,label:{en:String(r[4]),tr:String(r[5]||r[4]),ru:String(r[6]||r[4])},kw:split(r[7])};
      const key=String(r[0]).trim();
      if(key.toUpperCase()==='ALL'){tax.common.push(ty);return}
      let g=gmap[key]; if(!g){g=gmap[key]={id:'g'+Object.keys(gmap).length,label:{en:key,tr:String(r[1]||key),ru:String(r[2]||key)},kw:[key,...split(r[3])],types:[],products:[]};tax.groups.push(g)}
      else{ if(r[1]) g.label.tr=String(r[1]); if(r[2]) g.label.ru=String(r[2]); g.kw.push(...split(r[3])) }
      g.types.push(ty)});
    const ps=wb.Sheets['Products']; if(ps) XLSX.utils.sheet_to_json(ps,{header:1,defval:''}).slice(1).forEach(r=>{const g=gmap[String(r[0]).trim()]; if(g&&String(r[2]).trim()) g.products.push({code:String(r[1]||''),name:String(r[2]).trim()})});
    if(!tax.groups.length) throw new Error('empty');
    if(!tax.common.length) tax.common=JSON.parse(JSON.stringify(CFG0.taxonomy.common));
    CFG.taxonomy=tax; LS.set('taxonomy',tax); S.items.forEach(i=>{i.group='';i.auto={}}); S.types={}; S.autoTypes={}; renderAll(); toast(t('taxOk'));

};
